services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb_container
    restart: always
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    networks:
      - etl_network

  etl_app:
    build: .
    container_name: etl_migration_script
    depends_on:
      - mongodb
    env_file: .env
    environment:
      MONGO_DB: ${MONGO_DB}
      MONGO_COLLECTION: patients
      BATCH_SIZE: 1000
    networks:
      - etl_network

volumes:
  mongo_data:

networks:
  etl_network: