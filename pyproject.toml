[project]
name = "healthcare-migration"
version = "0.1.0"
description = "Migration ETL de données de santé vers MongoDB"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pymongo>=4.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

# Optionnel : dépendances pour le développement et les tests
[project.optional-dependencies]
dev = [
    # Framework de test pour assurer la fiabilité du code
    "pytest>=7.0.0",
    # Utilisation de la librairie mongomock pour le test due migration sans nécessiter une instance MongoDB réelle
    "mongomock>=4.1.0",
    # Linter pour assurer la qualité du code
    "ruff>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]